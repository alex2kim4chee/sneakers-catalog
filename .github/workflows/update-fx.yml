name: Update USD/RUB rate

on:
  schedule:
    # 06:00 UTC = 09:00 MSK, курс ЦБ на текущий день к этому моменту уже опубликован.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch USD/RUB rate
        run: python .github/scripts/update_fx.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- docs/fx.json; then
            echo "Курс не изменился — коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fx.json
          git commit -m "Update USD/RUB rate"
          git push
